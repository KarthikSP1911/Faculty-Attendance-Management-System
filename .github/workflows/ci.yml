name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly mutation run (Mondays 03:00 UTC)

# Secrets (Settings > Secrets > Actions): JWT_ACCESS_SECRET, JWT_REFRESH_SECRET. Never echo them.
# The database is a throwaway Postgres service container (public schema for E2E, fams_test for Jest).
env:
  DATABASE_URL: postgresql://fams:fams@localhost:5432/fams?schema=public
  DIRECT_URL: postgresql://fams:fams@localhost:5432/fams?schema=public
  TEST_DATABASE_URL: postgresql://fams:fams@localhost:5432/fams?schema=fams_test
  TEST_DIRECT_URL: postgresql://fams:fams@localhost:5432/fams?schema=fams_test
  JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
  JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
  CLIENT_URL: http://localhost:3000

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fams
          POSTGRES_PASSWORD: fams
          POSTGRES_DB: fams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fams -d fams"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrate public schema (E2E)
        run: npx prisma migrate deploy
        working-directory: apps/api
      - name: Migrate test schema (Jest)
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DIRECT_URL }}
      - name: Jest (unit + integration, coverage thresholds enforced)
        run: npm test
      - name: Build
        run: npm run build
      - name: Seed demo data (synthetic) for E2E
        run: npm run db:seed
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web
      - name: Playwright
        run: npm run test:e2e
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/api/coverage

  mutation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
      - name: Stryker (unit config)
        run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          if-no-files-found: ignore
          path: apps/api/reports
